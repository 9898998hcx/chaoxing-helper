name: resume-workshop

x-app: &app
  build:
    context: .
    args:
      API_INTERNAL_URL: http://api:3001
  image: resume-workshop:local
  init: true
  security_opt:
    - no-new-privileges:true

x-api-env: &api-env
  NODE_ENV: production
  API_HOST: 0.0.0.0
  PORT: 3001
  APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD:?Set a strong hexadecimal password}@postgres:5432/${POSTGRES_DB:-resume}?schema=public
  REDIS_URL: redis://redis:6379
  USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY:?Set a 32-byte hexadecimal encryption key}
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-20000}
  DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
  DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-1800}
  AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-3}
  AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-5}
  AI_MONTHLY_TOKEN_LIMIT: ${AI_MONTHLY_TOKEN_LIMIT:-1000000}
  AI_BUDGET_WARNING_PERCENT: ${AI_BUDGET_WARNING_PERCENT:-80}
  PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-20000}
  PDF_MAX_BYTES: ${PDF_MAX_BYTES:-10485760}
  PDF_MAX_INPUT_BYTES: ${PDF_MAX_INPUT_BYTES:-200000}
  PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
  S3_ARCHIVE_PDFS: ${S3_ARCHIVE_PDFS:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong hexadecimal password}
      POSTGRES_DB: ${POSTGRES_DB:-resume}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    environment: *api-env
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/postgresql/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    environment: *api-env
    command: ["node", "--import", "tsx", "apps/api/src/main.ts"]
    shm_size: 256mb
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    <<: *app
    restart: unless-stopped
    command: ["npm", "run", "start", "--workspace", "@resume/web", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    restart: "on-failure:3"
    environment: *api-env
    command: ["node", "--import", "tsx", "apps/worker/src/main.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
